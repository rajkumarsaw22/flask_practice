name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    name: Install Dependencies & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          ENABLE_DB: "false"
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package application
        run: |
          mkdir -p build
          zip -r build/flask_practice.zip . \
            -x ".git/*" ".github/*" "venv/*" "build/*" "__pycache__/*" "*.pyc"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: build/flask_practice.zip

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: MONGO_URI,SECRET_KEY
          script: |
            cd /home/${{ secrets.STAGING_USER }}/flask_practice || git clone -b staging https://github.com/${{ github.repository }}.git /home/${{ secrets.STAGING_USER }}/flask_practice
            cd /home/${{ secrets.STAGING_USER }}/flask_practice
            git fetch origin staging
            git reset --hard origin/staging
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            printf "MONGO_URI=%s\nSECRET_KEY=%s\n" "$MONGO_URI" "$SECRET_KEY" > .env
            pkill -f app.py || true
            nohup ./venv/bin/python app.py > app.log 2>&1 &
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: MONGO_URI,SECRET_KEY
          script: |
            cd /home/${{ secrets.PROD_USER }}/flask_practice || git clone -b main https://github.com/${{ github.repository }}.git /home/${{ secrets.PROD_USER }}/flask_practice
            cd /home/${{ secrets.PROD_USER }}/flask_practice
            git fetch --tags origin
            git checkout ${{ github.ref_name }}
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            printf "MONGO_URI=%s\nSECRET_KEY=%s\n" "$MONGO_URI" "$SECRET_KEY" > .env
            pkill -f app.py || true
            nohup ./venv/bin/python app.py > app.log 2>&1 &
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
